# The keeper, hosted on GitHub instead of a machine somebody has to keep awake.
#
# The first version of this file asked GitHub's scheduler for the heartbeat: a
# ten-minute cron, one cycle per run. Measured over the first night, that cron
# fired **once in 4 hours 48 minutes**, and the last observation on chain was
# 2h44m old against a 1800-second tolerance. Scheduled workflows are documented
# as best-effort and they mean it; high-frequency schedules are dropped rather
# than delayed.
#
# So the scheduler is no longer asked for a heartbeat. It is asked for a
# restart. One process runs for 5h45m driving its own 900-second cadence, and
# the cron only has to land once inside that window instead of every ten
# minutes - a far weaker thing to depend on. The concurrency group queues the
# next run behind the current one, so when a process reaches its budget the
# waiting run takes over with no gap.
#
# Two things worth stating rather than discovering: scheduled workflows are
# disabled automatically after 60 days without repository activity, and the
# signing seed lives in GitHub's secret store, which means GitHub and anyone
# with write access here can publish prices as all five sources. On a testnet
# whose faucet pays 0.5 WBT a day that is an acceptable trade; with value behind
# the oracle it would not be, and the seed must never be one that has held
# mainnet funds.

name: Keeper

permissions: {}

on:
  schedule:
    # Hourly at :13. Not on the hour: the top of the hour is when every cron on
    # the platform fires at once, and that is exactly when schedules get dropped.
    - cron: "13 * * * *"
  workflow_dispatch:

# One relayer account means one nonce, so runs must not overlap. `false` queues
# the next run behind the current one instead of killing a process mid-submit.
concurrency:
  group: cotejo-keeper
  cancel-in-progress: false

jobs:
  attest:
    name: Publish attestations
    runs-on: ubuntu-latest
    # GitHub kills a job at 6 hours. The process stops itself at 5h45m, so this
    # is only a backstop; a job killed by timeout is recorded as a failure and
    # would pollute the uptime history it exists to produce.
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci

      - name: Run the heartbeat
        working-directory: keeper
        env:
          COTEJO_KEEPER_MNEMONIC: ${{ secrets.COTEJO_KEEPER_MNEMONIC }}
          COTEJO_RELAYER_INDEX: ${{ vars.COTEJO_RELAYER_INDEX || '100' }}
          COTEJO_RUN_SECONDS: "20700"
        run: npm start
