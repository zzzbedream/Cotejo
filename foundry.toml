[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# Pinned: v0.8.24+commit.e11b9ed9 is present in the Whitechain Blockscout
# compiler list (GET /api/v2/smart-contracts/verification/config), so a
# contract built here can be verified on the explorer without a version bump.
solc_version = "0.8.24"

# Whitechain Sepolia runs Holocene from genesis, so Cancun opcodes (TSTORE,
# MCOPY) are available and the docs' own reference deployment verifies with
# EVM `cancun`. We still target `shanghai`: Cotejo uses no transient storage,
# shanghai bytecode executes unchanged on a cancun chain, and staying on the
# older target keeps the artifacts portable to any OP Stack chain that has not
# activated Ecotone yet.
evm_version = "shanghai"

optimizer = true
optimizer_runs = 200
via_ir = false

# Fail the build on any warning that indicates a real defect.

fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 200_000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5_000

# Deeper run for CI or pre-audit sweeps: `FOUNDRY_PROFILE=deep forge test`
[profile.deep.fuzz]
runs = 10_000

[profile.deep.invariant]
runs = 1_024
depth = 128

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"

[etherscan]
whitechain_sepolia = { key = "", url = "https://explorer.testnet.whitechain.io/api/", chain = 1874 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
